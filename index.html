<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>活动报名 · 后台管理</title>
    <!-- Font Awesome 6 (免费图标库) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.25s ease, color 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1.5rem 1rem;
        }

        /* CSS 变量 – 亮白 & 暗黑 */
        :root {
            --bg-body: #f6f9fc;
            --bg-card: #ffffff;
            --bg-card-alt: #f0f4f8;
            --bg-input: #ffffff;
            --bg-header: #ffffffcc;
            --text-primary: #0b1b2f;
            --text-secondary: #2c3e50;
            --text-muted: #4a5c6e;
            --border-light: #dce5ed;
            --shadow-card: 0 12px 30px rgba(0, 20, 40, 0.08);
            --shadow-hover: 0 20px 40px rgba(0, 20, 40, 0.12);
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-soft: #dbeafe;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --success: #16a34a;
            --radius: 24px;
            --radius-sm: 16px;
            --radius-xs: 12px;
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-card-alt: #2d3b52;
            --bg-input: #263348;
            --bg-header: #1e293bcc;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-light: #334155;
            --shadow-card: 0 12px 30px rgba(0, 0, 0, 0.6);
            --shadow-hover: 0 20px 40px rgba(0, 0, 0, 0.8);
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --accent-soft: #1e293b;
            --danger: #ef4444;
            --danger-hover: #f87171;
            --success: #22c55e;
        }

        /* 容器 */
        .container {
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
        }

        /* 头部 + 切换 */
        .app-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            background: var(--bg-header);
            backdrop-filter: blur(8px);
            padding: 0.9rem 1.5rem;
            border-radius: 60px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-light);
        }

        .app-header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            background: linear-gradient(145deg, var(--accent), #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 40px;
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            transition: 0.15s;
        }

        .theme-toggle:hover {
            background: var(--bg-card-alt);
            transform: scale(1.02);
        }

        .theme-toggle i {
            font-size: 1rem;
        }

        /* 卡片通用 */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            padding: 1.5rem 1.5rem 2rem;
            border: 1px solid var(--border-light);
            backdrop-filter: blur(2px);
            margin-bottom: 2rem;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title i {
            color: var(--accent);
        }

        /* 报名表单 — 纵向一行一个 */
        .form-stack {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .form-group label {
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .form-group input {
            background: var(--bg-input);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xs);
            padding: 0.8rem 1rem;
            font-size: 1rem;
            color: var(--text-primary);
            outline: none;
            transition: 0.2s;
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .btn {
            border: none;
            padding: 0.75rem 1.8rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            cursor: pointer;
            transition: 0.2s;
            background: var(--bg-card-alt);
            color: var(--text-primary);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-card);
            width: 100%;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.25);
        }

        .btn-success {
            background: var(--success);
            color: white;
            border: none;
        }
        .btn-success:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            border: none;
        }
        .btn-danger:hover {
            background: var(--danger-hover);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-light);
        }

        .btn-sm {
            padding: 0.45rem 1.2rem;
            font-size: 0.85rem;
            width: auto;
        }

        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .action-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-top: 1.2rem;
            gap: 0.8rem;
        }

        .admin-tools {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .alert {
            padding: 0.9rem 1.2rem;
            border-radius: var(--radius-xs);
            background: var(--accent-soft);
            color: var(--text-primary);
            border-left: 6px solid var(--accent);
            margin-top: 1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.95rem;
        }

        .alert-success {
            border-left-color: var(--success);
            background: #e6f7ec;
        }
        [data-theme="dark"] .alert-success {
            background: #1e3a2f;
        }

        /* 表格 */
        .table-responsive {
            overflow-x: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            margin-top: 0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 400px;
        }

        th {
            background: var(--bg-card-alt);
            color: var(--text-secondary);
            font-weight: 600;
            padding: 0.75rem 0.8rem;
            text-align: left;
            border-bottom: 2px solid var(--border-light);
        }

        td {
            padding: 0.7rem 0.8rem;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-primary);
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .badge-empty {
            color: var(--text-muted);
            padding: 2rem 0;
            text-align: center;
            font-style: italic;
        }

        /* 分页 */
        .pagination {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-top: 1.2rem;
        }

        .pagination button {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 40px;
            padding: 0.3rem 1rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.85rem;
        }

        .pagination button.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .pagination button:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .pagination span {
            color: var(--text-muted);
            padding: 0 0.2rem;
            font-size: 0.9rem;
        }

        /* 后台管理（默认隐藏） */
        #adminPanel {
            display: none;
        }

        #adminPanel.visible {
            display: block;
        }

        /* 密码模态框 (轻量) */
        .password-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 1rem;
        }

        .password-modal {
            background: var(--bg-card);
            padding: 2rem 1.8rem;
            border-radius: var(--radius);
            max-width: 380px;
            width: 100%;
            box-shadow: 0 40px 70px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-light);
        }

        .password-modal h3 {
            margin-bottom: 1rem;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .password-modal input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xs);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: 1.2rem;
        }

        .password-modal .actions {
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
        }

        .password-modal .actions .btn {
            width: auto;
            padding: 0.5rem 1.4rem;
        }

        .hidden {
            display: none !important;
        }

        /* 响应式 手机优化 */
        @media (max-width: 480px) {
            .app-header {
                flex-direction: column;
                align-items: stretch;
                gap: 0.6rem;
                border-radius: 32px;
                padding: 1rem 1.2rem;
            }
            .app-header h1 {
                font-size: 1.3rem;
            }
            .header-actions {
                justify-content: space-between;
            }
            .card {
                padding: 1.2rem 1rem 1.5rem;
            }
            .btn {
                font-size: 0.95rem;
                padding: 0.7rem 1.2rem;
            }
            .admin-tools .btn {
                font-size: 0.8rem;
                padding: 0.4rem 0.9rem;
            }
            .pagination {
                justify-content: center;
            }
            .password-modal {
                padding: 1.5rem 1.2rem;
            }
        }

        /* 更大屏幕留白舒适 */
        @media (min-width: 640px) {
            .container {
                max-width: 720px;
            }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- 头部 -->
    <header class="app-header">
        <h1><i class="fas fa-calendar-check" style="margin-right: 8px; -webkit-text-fill-color: var(--accent);"></i> XXX活动报名</h1>
        <div class="header-actions">
            <button class="theme-toggle" id="themeToggle" aria-label="切换亮暗模式">
                <i class="fas fa-moon"></i> <span id="themeLabel">暗黑</span>
            </button>
            <button class="btn btn-outline btn-sm" id="adminEntryBtn"><i class="fas fa-lock"></i> 后台</button>
        </div>
    </header>

    <!-- 报名表单卡片 (纵向一行一个) -->
    <section class="card" id="registrationCard">
        <div class="card-title"><i class="fas fa-pen-to-square"></i> 填写报名信息</div>
        <form id="registrationForm" class="form-stack">
            <div class="form-group">
                <label for="fullName"><i class="fas fa-user"></i> 姓名</label>
                <input type="text" id="fullName" placeholder="请输入姓名" required />
            </div>
            <div class="form-group">
                <label for="organization"><i class="fas fa-building"></i> 单位</label>
                <input type="text" id="organization" placeholder="请输入单位名称" required />
            </div>
            <div class="form-group">
                <label for="phone"><i class="fas fa-phone"></i> 联系电话</label>
                <input type="tel" id="phone" placeholder="请输入手机号" required />
            </div>
            <div class="form-group">
                <label for="attendees"><i class="fas fa-users"></i> 参加人数</label>
                <input type="number" id="attendees" placeholder="人数" min="1" value="1" required />
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> 立即报名</button>
        </form>
        <div id="feedbackMessage" class="alert hidden"></div>
    </section>

    <!-- 后台管理面板 (仅列表 + 导出/初始化) -->
    <section id="adminPanel" class="card">
        <div class="card-title"><i class="fas fa-user-gear"></i> 报名数据管理</div>
        <div class="action-bar">
            <div class="admin-tools">
                <button class="btn btn-success btn-sm" id="exportBtn"><i class="fas fa-file-excel"></i> 导出</button>
                <button class="btn btn-danger btn-sm" id="resetDataBtn"><i class="fas fa-trash-can"></i> 初始化</button>
            </div>
            <span style="font-size:0.9rem; color:var(--text-muted);"><i class="fas fa-database"></i> 共 <span id="recordCount">0</span> 条</span>
        </div>
        <div class="table-responsive">
            <table>
                <thead><tr><th>#</th><th>姓名</th><th>单位</th><th>电话</th><th>人数</th><th>报名时间</th></tr></thead>
                <tbody id="adminTableBody">
                    <tr><td colspan="6" class="badge-empty">暂无报名数据</td></tr>
                </tbody>
            </table>
        </div>
        <!-- 分页 -->
        <div class="pagination" id="paginationControls">
            <button id="prevPageBtn" disabled><i class="fas fa-chevron-left"></i> 上一页</button>
            <span id="pageInfo">1 / 1</span>
            <button id="nextPageBtn" disabled>下一页 <i class="fas fa-chevron-right"></i></button>
        </div>
    </section>
</div>

<!-- 密码模态框（通用） -->
<div id="passwordModal" class="password-overlay hidden">
    <div class="password-modal">
        <h3><i class="fas fa-key"></i> 管理员密码</h3>
        <input type="password" id="passwordInput" placeholder="请输入密码" autocomplete="off" />
        <div class="actions">
            <button class="btn btn-outline btn-sm" id="modalCancelBtn">取消</button>
            <button class="btn btn-primary btn-sm" id="modalConfirmBtn"><i class="fas fa-check"></i> 确认</button>
        </div>
        <div id="modalError" style="color:var(--danger); margin-top:0.8rem; font-size:0.9rem;"></div>
    </div>
</div>

<script>
    (function(){
        "use strict";

        // --- 数据层 ---
        const ADMIN_PASSWORD = 'admin123';
        let registrations = [];
        let currentPage = 1;
        const pageSize = 5;

        // DOM 引用
        const form = document.getElementById('registrationForm');
        const feedback = document.getElementById('feedbackMessage');
        const adminPanel = document.getElementById('adminPanel');
        const adminEntryBtn = document.getElementById('adminEntryBtn');
        const adminBody = document.getElementById('adminTableBody');
        const recordCountSpan = document.getElementById('recordCount');
        const prevPageBtn = document.getElementById('prevPageBtn');
        const nextPageBtn = document.getElementById('nextPageBtn');
        const pageInfo = document.getElementById('pageInfo');
        const exportBtn = document.getElementById('exportBtn');
        const resetDataBtn = document.getElementById('resetDataBtn');
        const themeToggle = document.getElementById('themeToggle');
        const themeLabel = document.getElementById('themeLabel');

        // 密码模态框
        const modal = document.getElementById('passwordModal');
        const passwordInput = document.getElementById('passwordInput');
        const modalConfirm = document.getElementById('modalConfirmBtn');
        const modalCancel = document.getElementById('modalCancelBtn');
        const modalError = document.getElementById('modalError');

        // --- 主题 ---
        function getCurrentTheme() {
            return document.documentElement.getAttribute('data-theme') || 'light';
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            const isDark = theme === 'dark';
            themeLabel.textContent = isDark ? '亮白' : '暗黑';
            themeToggle.querySelector('i').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }

        function toggleTheme() {
            const current = getCurrentTheme();
            setTheme(current === 'dark' ? 'light' : 'dark');
        }

        (function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved) {
                setTheme(saved);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                setTheme('dark');
            } else {
                setTheme('light');
            }
        })();

        themeToggle.addEventListener('click', toggleTheme);

        // --- 存储 ---
        function loadData() {
            try {
                const stored = localStorage.getItem('registrations');
                if (stored) {
                    registrations = JSON.parse(stored);
                } else {
                    // 首次使用：初始为空数组，不添加任何演示数据
                    registrations = [];
                }
            } catch (_) {
                registrations = [];
            }
        }

        function saveData() {
            localStorage.setItem('registrations', JSON.stringify(registrations));
        }

        // --- 渲染表格 + 分页 ---
        function renderAdminTable() {
            const total = registrations.length;
            const totalPages = Math.max(1, Math.ceil(total / pageSize));
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const start = (currentPage - 1) * pageSize;
            const end = Math.min(start + pageSize, total);
            const pageData = registrations.slice(start, end);

            recordCountSpan.textContent = total;

            if (pageData.length === 0) {
                adminBody.innerHTML = `<tr><td colspan="6" class="badge-empty">暂无报名数据</td></tr>`;
            } else {
                let html = '';
                pageData.forEach((r, idx) => {
                    const realIdx = start + idx + 1;
                    html += `<tr>
                        <td>${realIdx}</td>
                        <td><strong>${escapeHtml(r.name)}</strong></td>
                        <td>${escapeHtml(r.organization)}</td>
                        <td>${escapeHtml(r.phone)}</td>
                        <td>${r.attendees}</td>
                        <td>${escapeHtml(r.time)}</td>
                    </tr>`;
                });
                adminBody.innerHTML = html;
            }

            prevPageBtn.disabled = currentPage === 1;
            nextPageBtn.disabled = currentPage === totalPages;
            pageInfo.textContent = total === 0 ? '0 / 0' : `${currentPage} / ${totalPages}`;

            if (total === 0) {
                prevPageBtn.disabled = true;
                nextPageBtn.disabled = true;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        // --- 报名提交 ---
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('fullName').value.trim();
            const org = document.getElementById('organization').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const attendees = parseInt(document.getElementById('attendees').value, 10) || 1;

            if (!name || !org || !phone) {
                feedback.className = 'alert';
                feedback.innerHTML = '<i class="fas fa-circle-exclamation"></i> 请完整填写所有字段。';
                return;
            }

            const newEntry = {
                name, organization: org, phone, attendees,
                time: new Date().toLocaleString('zh-CN', { hour12: false })
            };
            registrations.push(newEntry);
            saveData();

            feedback.className = 'alert alert-success';
            feedback.innerHTML = '<i class="fas fa-check-circle"></i> 报名成功！感谢参与。';
            form.reset();
            document.getElementById('attendees').value = 1;

            if (adminPanel.classList.contains('visible')) {
                renderAdminTable();
            }

            setTimeout(() => {
                feedback.className = 'alert hidden';
            }, 4000);
        });

        // --- 后台管理入口 ---
        function openPasswordModal(actionType) {
            modal.classList.remove('hidden');
            passwordInput.value = '';
            modalError.textContent = '';
            passwordInput.focus();
            modal.dataset.action = actionType || 'admin';
        }

        function closePasswordModal() {
            modal.classList.add('hidden');
            modalError.textContent = '';
        }

        function verifyPassword(action) {
            const pwd = passwordInput.value.trim();
            if (pwd === ADMIN_PASSWORD) {
                closePasswordModal();
                if (action === 'admin') {
                    adminPanel.classList.add('visible');
                    renderAdminTable();
                    adminEntryBtn.innerHTML = '<i class="fas fa-lock-open"></i> 关闭后台';
                } else if (action === 'reset') {
                    if (registrations.length === 0) {
                        alert('数据已经是空的，无需初始化。');
                        return;
                    }
                    if (confirm('⚠️ 确定要清空所有报名数据吗？此操作不可撤销！')) {
                        registrations = [];
                        saveData();
                        renderAdminTable();
                        alert('已清空所有报名数据。');
                    }
                }
            } else {
                modalError.textContent = '❌ 密码错误，请重试。';
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        adminEntryBtn.addEventListener('click', function() {
            if (adminPanel.classList.contains('visible')) {
                adminPanel.classList.remove('visible');
                adminEntryBtn.innerHTML = '<i class="fas fa-lock"></i> 后台';
                return;
            }
            openPasswordModal('admin');
        });

        modalConfirm.addEventListener('click', function() {
            const action = modal.dataset.action || 'admin';
            verifyPassword(action);
        });

        modalCancel.addEventListener('click', closePasswordModal);
        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                modalConfirm.click();
            }
            if (e.key === 'Escape') {
                closePasswordModal();
            }
        });

        modal.addEventListener('click', function(e) {
            if (e.target === modal) closePasswordModal();
        });

        // --- 分页 ---
        prevPageBtn.addEventListener('click', function() {
            if (currentPage > 1) { currentPage--; renderAdminTable(); }
        });
        nextPageBtn.addEventListener('click', function() {
            const totalPages = Math.ceil(registrations.length / pageSize);
            if (currentPage < totalPages) { currentPage++; renderAdminTable(); }
        });

        // --- 导出 Excel (CSV) ---
        function exportToExcel() {
            if (registrations.length === 0) {
                alert('暂无数据可导出。');
                return;
            }
            const headers = ['姓名', '单位', '联系电话', '参加人数', '报名时间'];
            const rows = registrations.map(r => [
                r.name, r.organization, r.phone, r.attendees, r.time
            ]);
            let csv = headers.join(',') + '\n';
            rows.forEach(row => {
                csv += row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',') + '\n';
            });

            const blob = new Blob(['\uFEFF' + csv], { type: 'application/vnd.ms-excel;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `报名数据_${new Date().toISOString().slice(0,10)}.xls`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        exportBtn.addEventListener('click', exportToExcel);

        // --- 初始化 (重置) ---
        resetDataBtn.addEventListener('click', function() {
            openPasswordModal('reset');
        });

        // --- 加载数据 ---
        loadData();
        // 不再自动填充演示数据，保持 localStorage 中的真实状态
        renderAdminTable();
        // 默认后台隐藏
        adminPanel.classList.remove('visible');
        adminEntryBtn.innerHTML = '<i class="fas fa-lock"></i> 后台';
    })();
</script>
</body>
</html>
