<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>活动报名 · 后台管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.25s ease, color 0.2s, border-color 0.2s, box-shadow 0.2s; }
        body { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-body); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 1.5rem 1rem; }
        :root { --bg-body: #f6f9fc; --bg-card: #ffffff; --bg-card-alt: #f0f4f8; --bg-input: #ffffff; --bg-header: #ffffffcc; --text-primary: #0b1b2f; --text-secondary: #2c3e50; --text-muted: #4a5c6e; --border-light: #dce5ed; --shadow-card: 0 12px 30px rgba(0, 20, 40, 0.08); --accent: #2563eb; --accent-hover: #1d4ed8; --accent-soft: #dbeafe; --danger: #dc2626; --danger-hover: #b91c1c; --success: #16a34a; --radius: 24px; --radius-sm: 16px; --radius-xs: 12px; }
        [data-theme="dark"] { --bg-body: #0f172a; --bg-card: #1e293b; --bg-card-alt: #2d3b52; --bg-input: #263348; --bg-header: #1e293bcc; --text-primary: #f1f5f9; --text-secondary: #cbd5e1; --text-muted: #94a3b8; --border-light: #334155; --shadow-card: 0 12px 30px rgba(0, 0, 0, 0.6); --accent: #3b82f6; --accent-hover: #60a5fa; --accent-soft: #1e293b; --danger: #ef4444; --danger-hover: #f87171; --success: #22c55e; }
        .container { max-width: 720px; width: 100%; margin: 0 auto; }
        .app-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 2rem; background: var(--bg-header); backdrop-filter: blur(8px); padding: 0.9rem 1.5rem; border-radius: 60px; box-shadow: var(--shadow-card); border: 1px solid var(--border-light); }
        .app-header h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.01em; background: linear-gradient(145deg, var(--accent), #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.2; }
        .header-actions { display: flex; align-items: center; gap: 0.6rem; }
        .theme-toggle { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 40px; padding: 0.4rem 0.8rem; font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); display: flex; align-items: center; gap: 0.4rem; cursor: pointer; box-shadow: var(--shadow-card); transition: 0.15s; }
        .theme-toggle:hover { background: var(--bg-card-alt); transform: scale(1.02); }
        .theme-toggle i { font-size: 1rem; }
        .card { background: var(--bg-card); border-radius: var(--radius); box-shadow: var(--shadow-card); padding: 1.5rem 1.5rem 2rem; border: 1px solid var(--border-light); backdrop-filter: blur(2px); margin-bottom: 2rem; }
        .card-title { font-size: 1.3rem; font-weight: 600; margin-bottom: 1.5rem; color: var(--text-primary); display: flex; align-items: center; gap: 0.5rem; }
        .card-title i { color: var(--accent); }
        .form-stack { display: flex; flex-direction: column; gap: 1.2rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .form-group label { font-weight: 500; font-size: 0.95rem; color: var(--text-secondary); letter-spacing: 0.02em; display: flex; align-items: center; gap: 0.4rem; }
        .form-group input { background: var(--bg-input); border: 1px solid var(--border-light); border-radius: var(--radius-xs); padding: 0.8rem 1rem; font-size: 1rem; color: var(--text-primary); outline: none; transition: 0.2s; width: 100%; -webkit-appearance: none; appearance: none; }
        .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .btn { border: none; padding: 0.75rem 1.8rem; border-radius: 60px; font-weight: 600; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; cursor: pointer; transition: 0.2s; background: var(--bg-card-alt); color: var(--text-primary); border: 1px solid var(--border-light); box-shadow: var(--shadow-card); width: 100%; }
        .btn-primary { background: var(--accent); color: white; border: none; }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37, 99, 235, 0.25); }
        .btn-success { background: var(--success); color: white; border: none; }
        .btn-success:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .btn-danger { background: var(--danger); color: white; border: none; }
        .btn-danger:hover { background: var(--danger-hover); transform: translateY(-2px); }
        .btn-outline { background: transparent; border: 1px solid var(--border-light); }
        .btn-sm { padding: 0.45rem 1.2rem; font-size: 0.85rem; width: auto; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .action-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-top: 1.2rem; gap: 0.8rem; }
        .admin-tools { display: flex; flex-wrap: wrap; gap: 0.6rem; }
        .alert { padding: 0.9rem 1.2rem; border-radius: var(--radius-xs); background: var(--accent-soft); color: var(--text-primary); border-left: 6px solid var(--accent); margin-top: 1rem; font-weight: 500; display: flex; align-items: center; gap: 0.8rem; font-size: 0.95rem; }
        .alert-success { border-left-color: var(--success); background: #e6f7ec; }
        [data-theme="dark"] .alert-success { background: #1e3a2f; }
        .alert-error { border-left-color: var(--danger); background: #fee2e2; }
        [data-theme="dark"] .alert-error { background: #3b1f1f; }
        .table-responsive { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border-light); margin-top: 0.5rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 500px; }
        th { background: var(--bg-card-alt); color: var(--text-secondary); font-weight: 600; padding: 0.75rem 0.8rem; text-align: left; border-bottom: 2px solid var(--border-light); }
        td { padding: 0.7rem 0.8rem; border-bottom: 1px solid var(--border-light); color: var(--text-primary); }
        tr:last-child td { border-bottom: 0; }
        .badge-empty { color: var(--text-muted); padding: 2rem 0; text-align: center; font-style: italic; }
        .pagination { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 0.5rem; margin-top: 1.2rem; }
        .pagination button { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 40px; padding: 0.3rem 1rem; font-weight: 500; color: var(--text-secondary); cursor: pointer; transition: 0.15s; font-size: 0.85rem; }
        .pagination button:disabled { opacity: 0.4; pointer-events: none; }
        .pagination span { color: var(--text-muted); padding: 0 0.2rem; font-size: 0.9rem; }
        #adminPanel { display: none; }
        #adminPanel.visible { display: block; }
        .password-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 1rem; }
        .password-modal { background: var(--bg-card); padding: 2rem 1.8rem; border-radius: var(--radius); max-width: 380px; width: 100%; box-shadow: 0 40px 70px rgba(0, 0, 0, 0.3); border: 1px solid var(--border-light); }
        .password-modal h3 { margin-bottom: 1rem; font-weight: 600; font-size: 1.2rem; }
        .password-modal input { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-light); border-radius: var(--radius-xs); background: var(--bg-input); color: var(--text-primary); font-size: 1rem; margin-bottom: 1.2rem; }
        .password-modal .actions { display: flex; gap: 0.8rem; justify-content: flex-end; }
        .password-modal .actions .btn { width: auto; padding: 0.5rem 1.4rem; }
        .hidden { display: none !important; }
        @media (max-width: 480px) { .app-header { flex-direction: column; align-items: stretch; gap: 0.6rem; border-radius: 32px; padding: 1rem 1.2rem; } .app-header h1 { font-size: 1.3rem; } .header-actions { justify-content: space-between; } .card { padding: 1.2rem 1rem 1.5rem; } .btn { font-size: 0.95rem; padding: 0.7rem 1.2rem; } .admin-tools .btn { font-size: 0.8rem; padding: 0.4rem 0.9rem; } .pagination { justify-content: center; } .password-modal { padding: 1.5rem 1.2rem; } }
        @media (min-width: 640px) { .container { max-width: 720px; } }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-bar { background: var(--bg-card-alt); border-radius: var(--radius-xs); padding: 0.5rem 1rem; margin-bottom: 1rem; font-size: 0.85rem; border: 1px solid var(--border-light); display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
        .status-dot.loading { background: #f59e0b; animation: pulse 1s infinite; }
        .status-dot.success { background: #22c55e; }
        .status-dot.error { background: #ef4444; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>
<div class="container">
    <header class="app-header">
        <h1><i class="fas fa-calendar-check" style="margin-right: 8px; -webkit-text-fill-color: var(--accent);"></i> XXX活动报名</h1>
        <div class="header-actions">
            <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i> <span id="themeLabel">暗黑</span></button>
            <button class="btn btn-outline btn-sm" id="adminEntryBtn"><i class="fas fa-lock"></i> 后台</button>
        </div>
    </header>

    <div class="status-bar" id="statusBar">
        <span class="status-dot loading" id="statusDot"></span>
        <span id="statusText">⏳ 正在初始化...</span>
    </div>

    <section class="card">
        <div class="card-title"><i class="fas fa-pen-to-square"></i> 填写报名信息</div>
        <form id="registrationForm" class="form-stack">
            <div class="form-group"><label><i class="fas fa-user"></i> 姓名</label><input type="text" id="fullName" placeholder="请输入姓名" required /></div>
            <div class="form-group"><label><i class="fas fa-building"></i> 单位</label><input type="text" id="organization" placeholder="请输入单位名称" required /></div>
            <div class="form-group"><label><i class="fas fa-envelope"></i> 邮箱地址</label><input type="email" id="email" placeholder="请输入邮箱地址" required /></div>
            <div class="form-group"><label><i class="fas fa-phone"></i> 联系电话</label><input type="tel" id="phone" placeholder="请输入手机号" required /></div>
            <div class="form-group"><label><i class="fas fa-users"></i> 参加人数</label><input type="number" id="attendees" placeholder="人数" min="1" value="1" required /></div>
            <button type="submit" class="btn btn-primary" id="submitBtn"><i class="fas fa-paper-plane"></i> 立即报名</button>
        </form>
        <div id="feedbackMessage" class="alert hidden"></div>
    </section>

    <section id="adminPanel" class="card">
        <div class="card-title"><i class="fas fa-user-gear"></i> 报名数据管理</div>
        <div class="action-bar">
            <div class="admin-tools">
                <button class="btn btn-success btn-sm" id="exportBtn"><i class="fas fa-file-excel"></i> 导出</button>
                <button class="btn btn-danger btn-sm" id="resetDataBtn"><i class="fas fa-trash-can"></i> 初始化</button>
            </div>
            <span><i class="fas fa-database"></i> 共 <span id="recordCount">0</span> 条</span>
        </div>
        <div class="table-responsive">
            <table>
                <thead><tr><th>#</th><th>姓名</th><th>单位</th><th>邮箱</th><th>电话</th><th>人数</th><th>报名时间</th></tr></thead>
                <tbody id="adminTableBody"><tr><td colspan="7" class="badge-empty">暂无报名数据</td></tr></tbody>
            </table>
        </div>
        <div class="pagination">
            <button id="prevPageBtn" disabled><i class="fas fa-chevron-left"></i> 上一页</button>
            <span id="pageInfo">1 / 1</span>
            <button id="nextPageBtn" disabled>下一页 <i class="fas fa-chevron-right"></i></button>
        </div>
    </section>
</div>

<div id="passwordModal" class="password-overlay hidden">
    <div class="password-modal">
        <h3><i class="fas fa-key"></i> 管理员密码</h3>
        <input type="password" id="passwordInput" placeholder="请输入密码" />
        <div class="actions">
            <button class="btn btn-outline btn-sm" id="modalCancelBtn">取消</button>
            <button class="btn btn-primary btn-sm" id="modalConfirmBtn"><i class="fas fa-check"></i> 确认</button>
        </div>
        <div id="modalError" style="color:var(--danger); margin-top:0.8rem;"></div>
    </div>
</div>

<!-- ================================================================ -->
<!-- 使用 MongoDB 4.17.0 浏览器驱动 -->
<!-- 注意：这个驱动在浏览器中是通过 mongodb 全局对象访问的 -->
<!-- ================================================================ -->
<script src="mongodb+srv://fengccn1fc_db_user:zzb%402001@cluster0.tfkfyrl.mongodb.net/?appName=Cluster0">
</script>

<script>
    // ================================================================
    // ⚠️ 请把下面这行替换成您的 MongoDB 连接字符串
    // ================================================================
    const CONNECTION_STRING = "mongodb+srv://fengccn1fc_db_user:zzb%402001@cluster0.mongodb.net/?retryWrites=true&w=majority";
    // ================================================================
    const ADMIN_PASSWORD = "admin123";

    console.log('🚀 页面启动...');
    console.log('📡 连接字符串前缀:', CONNECTION_STRING.substring(0, 30) + '...');

    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');

    // DOM 引用
    const form = document.getElementById('registrationForm');
    const feedback = document.getElementById('feedbackMessage');
    const adminPanel = document.getElementById('adminPanel');
    const adminEntryBtn = document.getElementById('adminEntryBtn');
    const adminBody = document.getElementById('adminTableBody');
    const recordCount = document.getElementById('recordCount');
    const prevBtn = document.getElementById('prevPageBtn');
    const nextBtn = document.getElementById('nextPageBtn');
    const pageInfo = document.getElementById('pageInfo');
    const exportBtn = document.getElementById('exportBtn');
    const resetBtn = document.getElementById('resetDataBtn');
    const themeToggle = document.getElementById('themeToggle');
    const themeLabel = document.getElementById('themeLabel');
    const submitBtn = document.getElementById('submitBtn');
    const modal = document.getElementById('passwordModal');
    const pwdInput = document.getElementById('passwordInput');
    const modalConfirm = document.getElementById('modalConfirmBtn');
    const modalCancel = document.getElementById('modalCancelBtn');
    const modalError = document.getElementById('modalError');

    let data = [];
    let page = 1;
    const pageSize = 5;
    let client = null;

    // 主题切换
    function setTheme(t) {
        document.documentElement.setAttribute('data-theme', t);
        localStorage.setItem('theme', t);
        const dark = t === 'dark';
        themeLabel.textContent = dark ? '亮白' : '暗黑';
        themeToggle.querySelector('i').className = dark ? 'fas fa-sun' : 'fas fa-moon';
    }
    const savedTheme = localStorage.getItem('theme');
    setTheme(savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    themeToggle.onclick = () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

    // ================================================================
    // 获取 MongoDB 驱动（关键修复）
    // ================================================================

    function getMongoClient() {
        // 尝试从 window.mongodb 获取
        if (window.mongodb && window.mongodb.MongoClient) {
            console.log('✅ 从 window.mongodb 获取 MongoClient');
            return window.mongodb.MongoClient;
        }
        // 尝试从全局获取
        if (typeof MongoClient !== 'undefined') {
            console.log('✅ 从全局获取 MongoClient');
            return MongoClient;
        }
        return null;
    }

    function waitForDriver() {
        return new Promise((resolve, reject) => {
            let attempts = 0;
            const maxAttempts = 60;

            const check = () => {
                attempts++;
                const client = getMongoClient();
                if (client) {
                    console.log('✅ MongoDB 驱动已就绪');
                    resolve(client);
                    return;
                }
                if (attempts >= maxAttempts) {
                    reject(new Error('MongoDB 驱动加载超时，请刷新页面重试'));
                    return;
                }
                setTimeout(check, 200);
            };
            check();
        });
    }

    // ================================================================
    // 数据库操作
    // ================================================================

    async function getCollection() {
        if (!client) {
            statusText.textContent = '🔌 正在连接数据库...';
            statusDot.className = 'status-dot loading';
            try {
                const MongoClient = getMongoClient();
                if (!MongoClient) {
                    throw new Error('MongoDB 驱动未加载，请刷新页面');
                }
                client = new MongoClient(CONNECTION_STRING);
                await client.connect();
                console.log('✅ 数据库连接成功！');
                statusText.textContent = '✅ 数据库已连接';
                statusDot.className = 'status-dot success';
            } catch (e) {
                console.error('❌ 数据库连接失败:', e);
                statusText.textContent = '❌ 连接失败: ' + e.message;
                statusDot.className = 'status-dot error';
                alert('⚠️ 数据库连接失败！\n\n请检查:\n1. 连接字符串中的用户名和密码是否正确\n2. MongoDB Atlas 的 IP 白名单是否允许所有IP (0.0.0.0/0)\n3. 网络连接是否正常\n\n错误信息: ' + e.message);
                throw e;
            }
        }
        const db = client.db('registration_db');
        return db.collection('registrations');
    }

    async function loadData() {
        try {
            statusText.textContent = '📥 正在加载数据...';
            statusDot.className = 'status-dot loading';

            const collection = await getCollection();
            const docs = await collection.find().sort({ time: -1 }).toArray();

            data = docs.map(d => ({
                id: d._id.toString(),
                name: d.name || '',
                organization: d.organization || '',
                email: d.email || '',
                phone: d.phone || '',
                attendees: d.attendees || 1,
                time: d.time || ''
            }));

            renderTable();
            statusText.textContent = `✅ 已加载 ${data.length} 条数据`;
            statusDot.className = 'status-dot success';
            console.log(`✅ 加载 ${data.length} 条数据`);
        } catch (e) {
            console.error('❌ 加载失败:', e);
            statusText.textContent = '❌ 加载失败: ' + e.message;
            statusDot.className = 'status-dot error';
            data = [];
            renderTable();
        }
    }

    async function saveRegistration(entry) {
        try {
            const collection = await getCollection();
            const result = await collection.insertOne(entry);
            console.log('✅ 保存成功，ID:', result.insertedId);
            return true;
        } catch (e) {
            console.error('❌ 保存失败:', e);
            alert('⚠️ 保存数据失败: ' + e.message);
            return false;
        }
    }

    async function clearAllData() {
        try {
            const collection = await getCollection();
            await collection.deleteMany({});
            console.log('✅ 清空成功');
            return true;
        } catch (e) {
            console.error('❌ 清空失败:', e);
            alert('⚠️ 清空数据失败: ' + e.message);
            return false;
        }
    }

    function renderTable() {
        const total = data.length;
        const totalPages = Math.max(1, Math.ceil(total / pageSize));
        if (page > totalPages) page = totalPages;
        const start = (page - 1) * pageSize;
        const pageData = data.slice(start, start + pageSize);
        recordCount.textContent = total;

        if (pageData.length === 0) {
            adminBody.innerHTML = '<tr><td colspan="7" class="badge-empty">暂无报名数据</td></tr>';
        } else {
            adminBody.innerHTML = pageData.map((r, i) => `
                <tr>
                    <td>${start + i + 1}</td>
                    <td><strong>${r.name || ''}</strong></td>
                    <td>${r.organization || ''}</td>
                    <td>${r.email || ''}</td>
                    <td>${r.phone || ''}</td>
                    <td>${r.attendees || 1}</td>
                    <td>${r.time || ''}</td>
                </tr>
            `).join('');
        }
        prevBtn.disabled = page === 1;
        nextBtn.disabled = page === totalPages;
        pageInfo.textContent = total === 0 ? '0 / 0' : `${page} / ${totalPages}`;
    }

    function showMsg(msg, type = 'success') {
        feedback.className = `alert alert-${type}`;
        feedback.innerHTML = msg;
        feedback.classList.remove('hidden');
        setTimeout(() => feedback.className = 'alert hidden', 4000);
    }

    // 报名提交
    form.onsubmit = async function(e) {
        e.preventDefault();
        const name = document.getElementById('fullName').value.trim();
        const org = document.getElementById('organization').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const attendees = parseInt(document.getElementById('attendees').value) || 1;

        if (!name || !org || !email || !phone) { showMsg('请完整填写所有字段', 'error'); return; }
        if (!email.includes('@')) { showMsg('请输入正确邮箱', 'error'); return; }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="loading-spinner"></span> 提交中...';

        try {
            const newEntry = {
                name,
                organization: org,
                email,
                phone,
                attendees,
                time: new Date().toLocaleString('zh-CN')
            };
            const success = await saveRegistration(newEntry);
            if (success) {
                showMsg('✅ 报名成功！感谢参与', 'success');
                form.reset();
                document.getElementById('attendees').value = 1;
                await loadData();
            } else {
                showMsg('❌ 报名失败，请重试', 'error');
            }
        } catch (e) {
            console.error('❌ 提交失败:', e);
            showMsg('❌ 报名失败: ' + e.message, 'error');
        }
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 立即报名';
    };

    // 后台管理
    adminEntryBtn.onclick = function() {
        if (adminPanel.classList.contains('visible')) {
            adminPanel.classList.remove('visible');
            this.innerHTML = '<i class="fas fa-lock"></i> 后台';
            return;
        }
        modal.classList.remove('hidden');
        pwdInput.value = '';
        modalError.textContent = '';
        pwdInput.focus();
        modal.dataset.action = 'admin';
    };

    async function verifyPwd(action) {
        if (pwdInput.value.trim() === ADMIN_PASSWORD) {
            modal.classList.add('hidden');
            if (action === 'admin') {
                adminPanel.classList.add('visible');
                adminEntryBtn.innerHTML = '<i class="fas fa-lock-open"></i> 关闭后台';
                await loadData();
            } else if (action === 'reset') {
                if (data.length === 0) { alert('数据已空'); return; }
                if (confirm('⚠️ 确定清空所有数据？此操作不可恢复！')) {
                    const success = await clearAllData();
                    if (success) {
                        await loadData();
                        alert('✅ 已清空所有数据');
                    }
                }
            }
        } else {
            modalError.textContent = '❌ 密码错误，请重试';
            pwdInput.value = '';
            pwdInput.focus();
        }
    }

    modalConfirm.onclick = () => verifyPwd(modal.dataset.action || 'admin');
    modalCancel.onclick = () => modal.classList.add('hidden');
    pwdInput.onkeydown = (e) => { if (e.key === 'Enter') modalConfirm.click(); if (e.key === 'Escape') modalCancel.click(); };

    resetBtn.onclick = function() {
        modal.classList.remove('hidden');
        pwdInput.value = '';
        modalError.textContent = '';
        pwdInput.focus();
        modal.dataset.action = 'reset';
    };

    prevBtn.onclick = () => { if (page > 1) { page--; renderTable(); } };
    nextBtn.onclick = () => { const total = Math.ceil(data.length / pageSize); if (page < total) { page++; renderTable(); } };

    exportBtn.onclick = function() {
        if (data.length === 0) { alert('无数据可导出'); return; }
        const headers = ['姓名', '单位', '邮箱', '电话', '人数', '时间'];
        const rows = data.map(r => [r.name, r.organization, r.email, r.phone, r.attendees, r.time]);
        let csv = headers.join(',') + '\n' + rows.map(row => row.map(v => `"${v}"`).join(',')).join('\n');
        const blob = new Blob(['\uFEFF' + csv], { type: 'application/vnd.ms-excel' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `报名数据_${new Date().toISOString().slice(0,10)}.xls`;
        a.click();
        URL.revokeObjectURL(a.href);
    };

    // ================================================================
    // 🚀 启动
    // ================================================================
    statusText.textContent = '⏳ 正在初始化...';
    statusDot.className = 'status-dot loading';

    if (CONNECTION_STRING.includes("你的用户名") || CONNECTION_STRING.includes("你的密码")) {
        statusText.textContent = '⚠️ 请先配置连接字符串';
        statusDot.className = 'status-dot error';
        alert('⚠️ 请先配置连接字符串！\n\n在 MongoDB Atlas → Connect → Connect your application 中复制您的连接字符串，然后替换代码中的 CONNECTION_STRING 变量。');
    } else {
        // 先等待驱动加载
        waitForDriver()
            .then(() => {
                console.log('✅ 驱动已就绪，开始加载数据...');
                return loadData();
            })
            .then(() => {
                console.log('✅ 页面完全加载完成');
            })
            .catch(e => {
                console.error('❌ 初始化失败:', e);
                statusText.textContent = '❌ 初始化失败: ' + e.message;
                statusDot.className = 'status-dot error';
                alert('⚠️ 初始化失败！\n\n' + e.message);
            });
    }
</script>
</body>
</html>
